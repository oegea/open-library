<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img"><title>Elementos de una antena yagi</title><defs><marker id="arr-2563EB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker></defs><rect x="1" y="1" width="638" height="438" rx="18" fill="#FAF6EC" stroke="#E7DFCC" stroke-width="2"/><text x="320" y="44" font-size="22" text-anchor="middle" font-weight="bold" fill="#1F2933">La yagi, vista desde arriba</text>
<line x1="90" y1="215" x2="520" y2="215" stroke="#5B6673" stroke-width="6" stroke-linecap="round"/>
<line x1="120" y1="140.0" x2="120" y2="290.0" stroke="#1F2933" stroke-width="7" stroke-linecap="round"/>
