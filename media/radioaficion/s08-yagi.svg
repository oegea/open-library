<text x="120" y="321" font-size="19" text-anchor="middle" font-weight="bold" fill="#1F2933">reflector</text>
<text x="120" y="345" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">(el más largo)</text>
<text x="240" y="123" font-size="19" text-anchor="middle" font-weight="bold" fill="#D97706">dipolo activo</text>
<text x="240" y="99" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">el cable va aquí:</text>
<text x="420" y="321" font-size="19" text-anchor="middle" font-weight="bold" fill="#1F2933">directores</text>
<text x="420" y="345" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">(más cortos)</text>
<line x1="535" y1="215" x2="610" y2="215" stroke="#2563EB" stroke-width="6" stroke-linecap="round" marker-end="url(#arr-2563EB)"/>
<text x="572" y="197" font-size="19" text-anchor="middle" font-weight="bold" fill="#2563EB">radia</text>
<text x="60" y="222" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">atrás</text>
<text x="320" y="412" font-size="19" text-anchor="middle" font-weight="normal" fill="#5B6673">Solo el dipolo está conectado; los demás son parásitos</text></svg>
