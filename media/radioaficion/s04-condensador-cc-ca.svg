<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img"><title>La membrana con corriente continua y con alterna</title><defs><marker id="arr-0284C7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0284C7"/></marker></defs><rect x="1" y="1" width="638" height="468" rx="18" fill="#FAF6EC" stroke="#E7DFCC" stroke-width="2"/><text x="320" y="42" font-size="21" text-anchor="middle" font-weight="bold" fill="#1F2933">Con continua: se abomba y el agua se para</text>
<rect x="90" y="70" width="460" height="90" rx="8" fill="#BAE6FD" stroke="#0284C7" stroke-width="3"/>
<path d="M320 71 Q392 115 320 159" stroke="#DC2626" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="120" y1="115" x2="220" y2="115" stroke="#0284C7" stroke-width="5" stroke-linecap="round" marker-end="url(#arr-0284C7)"/>
<text x="455" y="122" font-size="20" text-anchor="middle" font-weight="bold" fill="#5B6673">parada</text>
<text x="320" y="196" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">La bomba empuja siempre hacia el mismo lado</text>
<line x1="60" y1="224" x2="580" y2="224" stroke="#E7DFCC" stroke-width="2" stroke-linecap="round"/>
<text x="320" y="264" font-size="21" text-anchor="middle" font-weight="bold" fill="#1F2933">Con alterna: oscila y el agua va y viene</text>
<rect x="90" y="292" width="460" height="90" rx="8" fill="#BAE6FD" stroke="#0284C7" stroke-width="3"/>
<path d="M320 293 Q392 337 320 381" stroke="#DC2626" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M320 293 Q248 337 320 381" stroke="#DC2626" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/>
<line x1="170.0" y1="337" x2="115" y2="337" stroke="#0284C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-0284C7)"/>
<line x1="170.0" y1="337" x2="225" y2="337" stroke="#0284C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-0284C7)"/>
<line x1="470.0" y1="337" x2="415" y2="337" stroke="#0284C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-0284C7)"/>
<line x1="470.0" y1="337" x2="525" y2="337" stroke="#0284C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-0284C7)"/>
<text x="320" y="418" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">El émbolo empuja y tira, sin parar</text>
<text x="320" y="446" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">Ni una gota cruza la membrana</text></svg>
