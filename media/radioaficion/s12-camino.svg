<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 910" width="640" height="910" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img"><title>El camino administrativo en España, del examen a la primera emisión</title><defs><marker id="arr-1F2933" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F2933"/></marker></defs><rect x="1" y="1" width="638" height="908" rx="18" fill="#FAF6EC" stroke="#E7DFCC" stroke-width="2"/><text x="320" y="42" font-size="22" text-anchor="middle" font-weight="bold" fill="#1F2933">Del examen a la primera emisión</text>
<rect x="70" y="66" width="500" height="84" rx="14" fill="#EFE7D6" stroke="#1F2933" stroke-width="3"/>
<circle cx="110" cy="108" r="20" fill="#1F2933" stroke="#1F2933" stroke-width="3"/>
<text x="110" y="116" font-size="22" text-anchor="middle" font-weight="bold" fill="#FFFFFF">1</text>
<text x="146" y="102" font-size="20" text-anchor="start" font-weight="bold" fill="#1F2933">Solicitud de examen y tasa</text>
<text x="146" y="130" font-size="18" text-anchor="start" font-weight="normal" fill="#5B6673">En la sede electrónica del Ministerio</text>
<line x1="320" y1="152" x2="320" y2="172" stroke="#1F2933" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-1F2933)"/>
<rect x="70" y="176" width="500" height="84" rx="14" fill="#EFE7D6" stroke="#1F2933" stroke-width="3"/>
<circle cx="110" cy="218" r="20" fill="#1F2933" stroke="#1F2933" stroke-width="3"/>
<text x="110" y="226" font-size="22" text-anchor="middle" font-weight="bold" fill="#FFFFFF">2</text>
<text x="146" y="212" font-size="20" text-anchor="start" font-weight="bold" fill="#1F2933">Examen: dos partes de 30 preguntas</text>
<text x="146" y="240" font-size="18" text-anchor="start" font-weight="normal" fill="#5B6673">15 aciertos en cada una · 90 minutos</text>
<line x1="320" y1="262" x2="320" y2="282" stroke="#1F2933" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-1F2933)"/>
<rect x="70" y="286" width="500" height="84" rx="14" fill="#FDE68A" stroke="#1F2933" stroke-width="3"/>
<circle cx="110" cy="328" r="20" fill="#1F2933" stroke="#1F2933" stroke-width="3"/>
<text x="110" y="336" font-size="22" text-anchor="middle" font-weight="bold" fill="#FFFFFF">3</text>
<text x="146" y="322" font-size="20" text-anchor="start" font-weight="bold" fill="#1F2933">Certificado HAREC</text>
<text x="146" y="350" font-size="18" text-anchor="start" font-weight="normal" fill="#5B6673">Acredita que has superado la prueba</text>
<line x1="320" y1="372" x2="320" y2="392" stroke="#1F2933" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-1F2933)"/>
<rect x="70" y="396" width="500" height="84" rx="14" fill="#EFE7D6" stroke="#1F2933" stroke-width="3"/>
<circle cx="110" cy="438" r="20" fill="#1F2933" stroke="#1F2933" stroke-width="3"/>
<text x="110" y="446" font-size="22" text-anchor="middle" font-weight="bold" fill="#FFFFFF">4</text>
<text x="146" y="432" font-size="20" text-anchor="start" font-weight="bold" fill="#1F2933">Solicitud de autorización y tasa</text>
<text x="146" y="460" font-size="18" text-anchor="start" font-weight="normal" fill="#5B6673">La Administración tiene seis semanas</text>
<line x1="320" y1="482" x2="320" y2="502" stroke="#1F2933" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-1F2933)"/>
<rect x="70" y="506" width="500" height="84" rx="14" fill="#FDE68A" stroke="#1F2933" stroke-width="3"/>
<circle cx="110" cy="548" r="20" fill="#1F2933" stroke="#1F2933" stroke-width="3"/>
<text x="110" y="556" font-size="22" text-anchor="middle" font-weight="bold" fill="#FFFFFF">5</text>
<text x="146" y="542" font-size="20" text-anchor="start" font-weight="bold" fill="#1F2933">Autorización y distintivo de llamada</text>
<text x="146" y="570" font-size="18" text-anchor="start" font-weight="normal" fill="#5B6673">Personal, intransferible, sin caducidad</text>
<path d="M320 592 V612 H170 V634" stroke="#1F2933" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-1F2933)"/>
<path d="M320 612 H470 V634" stroke="#1F2933" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-1F2933)"/>
<rect x="30" y="640" width="280" height="150" rx="14" fill="#D1FAE5" stroke="#059669" stroke-width="3"/>
<text x="170" y="674" font-size="20" text-anchor="middle" font-weight="bold" fill="#1F2933">Equipo móvil</text>
<text x="170" y="700" font-size="20" text-anchor="middle" font-weight="bold" fill="#1F2933">o portátil</text>
<text x="170" y="738" font-size="20" text-anchor="middle" font-weight="bold" fill="#059669">Ya puedes emitir</text>
<text x="170" y="766" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">con la autorización</text>
<rect x="330" y="640" width="280" height="150" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/>
<text x="470" y="674" font-size="20" text-anchor="middle" font-weight="bold" fill="#1F2933">Estación fija</text>
<text x="470" y="702" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">Hace falta además</text>
<text x="470" y="728" font-size="19" text-anchor="middle" font-weight="bold" fill="#D97706">la licencia de estación</text>
<text x="470" y="762" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">solicitud, montaje,</text>
<text x="470" y="784" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">seguro e inspección</text>
<line x1="470" y1="794" x2="470" y2="818" stroke="#1F2933" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-1F2933)"/>
<rect x="330" y="824" width="280" height="62" rx="14" fill="#D1FAE5" stroke="#059669" stroke-width="3"/>
<text x="470" y="864" font-size="19" text-anchor="middle" font-weight="bold" fill="#059669">Ya puedes emitir desde casa</text></svg>
