<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img"><title>La cadena de una estación en decibelios</title><defs><marker id="arr-1F2933" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F2933"/></marker></defs><rect x="1" y="1" width="638" height="478" rx="18" fill="#FAF6EC" stroke="#E7DFCC" stroke-width="2"/><text x="320" y="42" font-size="22" text-anchor="middle" font-weight="bold" fill="#1F2933">Una estación, sumando decibelios</text>
<rect x="40" y="90" width="160" height="96" rx="12" fill="#FFFFFF" stroke="#1F2933" stroke-width="4"/>
<text x="120" y="132" font-size="21" text-anchor="middle" font-weight="bold" fill="#1F2933">transmisor</text>
<rect x="240" y="90" width="160" height="96" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="4"/>
<text x="320" y="132" font-size="21" text-anchor="middle" font-weight="bold" fill="#1F2933">cable</text>
<text x="320" y="166" font-size="24" text-anchor="middle" font-weight="bold" fill="#DC2626">−3 dB</text>
<rect x="440" y="90" width="160" height="96" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="4"/>
<text x="520" y="132" font-size="21" text-anchor="middle" font-weight="bold" fill="#1F2933">antena</text>
<text x="520" y="166" font-size="24" text-anchor="middle" font-weight="bold" fill="#059669">+6 dB</text>
<line x1="202" y1="138" x2="236" y2="138" stroke="#1F2933" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-1F2933)"/>
<line x1="402" y1="138" x2="436" y2="138" stroke="#1F2933" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-1F2933)"/>
<line x1="120" y1="190" x2="120" y2="228" stroke="#5B6673" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/>
<text x="120" y="262" font-size="28" text-anchor="middle" font-weight="bold" fill="#2563EB">100 W</text>
<text x="120" y="290" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">sale</text>
<line x1="320" y1="190" x2="320" y2="228" stroke="#5B6673" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/>
<text x="320" y="262" font-size="28" text-anchor="middle" font-weight="bold" fill="#2563EB">50 W</text>
<text x="320" y="290" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">llega a la antena</text>
<line x1="520" y1="190" x2="520" y2="228" stroke="#5B6673" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/>
<text x="520" y="262" font-size="28" text-anchor="middle" font-weight="bold" fill="#2563EB">200 W</text>
<text x="520" y="290" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">equivalentes</text>
<text x="220" y="250" font-size="22" text-anchor="middle" font-weight="bold" fill="#DC2626">÷ 2</text>
<text x="420" y="250" font-size="22" text-anchor="middle" font-weight="bold" fill="#059669">× 4</text>
<rect x="60" y="330" width="520" height="112" rx="14" fill="#EFE7D6" stroke="none" stroke-width="2"/>
<text x="320" y="372" font-size="28" text-anchor="middle" font-weight="bold" fill="#1F2933">−3 dB + 6 dB = +3 dB</text>
<text x="320" y="414" font-size="21" text-anchor="middle" font-weight="normal" fill="#5B6673">+3 dB es el doble: 100 W → 200 W</text></svg>
