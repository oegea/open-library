<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" width="640" height="550" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img"><title>Una onda en una unión entre cuerdas iguales y entre cuerdas distintas</title><defs><marker id="arr-059669" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arr-DC2626" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker></defs><rect x="1" y="1" width="638" height="548" rx="18" fill="#FAF6EC" stroke="#E7DFCC" stroke-width="2"/><text x="320" y="42" font-size="21" text-anchor="middle" font-weight="bold" fill="#1F2933">Qué le pasa a una onda al llegar a un nudo</text>
