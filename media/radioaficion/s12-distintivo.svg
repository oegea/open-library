<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img"><title>Las tres piezas de un distintivo de llamada español</title><rect x="1" y="1" width="638" height="498" rx="18" fill="#FAF6EC" stroke="#E7DFCC" stroke-width="2"/><text x="320" y="42" font-size="22" text-anchor="middle" font-weight="bold" fill="#1F2933">Las tres piezas de un distintivo</text>
<rect x="75.0" y="70" width="150" height="110" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="5"/>
<text x="150" y="152" font-size="76" text-anchor="middle" font-weight="bold" fill="#2563EB">EA</text>
<line x1="150" y1="184" x2="150" y2="216" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
<rect x="260.0" y="70" width="80" height="110" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="5"/>
<text x="300" y="152" font-size="76" text-anchor="middle" font-weight="bold" fill="#D97706">5</text>
<line x1="300" y1="184" x2="300" y2="216" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
<rect x="355.0" y="70" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="5"/>
<text x="455" y="152" font-size="76" text-anchor="middle" font-weight="bold" fill="#059669">JMS</text>
<line x1="455" y1="184" x2="455" y2="216" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
<text x="150" y="244" font-size="20" text-anchor="middle" font-weight="bold" fill="#2563EB">PREFIJO</text>
<text x="150" y="272" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">el país y el</text>
<text x="150" y="294" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">tipo de estación</text>
<text x="300" y="244" font-size="20" text-anchor="middle" font-weight="bold" fill="#D97706">DISTRITO</text>
<text x="300" y="272" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">dónde vivías</text>
<text x="300" y="294" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">al obtenerlo</text>
<text x="465" y="244" font-size="20" text-anchor="middle" font-weight="bold" fill="#059669">SUFIJO</text>
<text x="465" y="272" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">hasta tres letras,</text>
<text x="465" y="294" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">por orden de llegada</text>
<line x1="60" y1="326" x2="580" y2="326" stroke="#E7DFCC" stroke-width="2" stroke-linecap="round"/>
<text x="320" y="362" font-size="20" text-anchor="middle" font-weight="bold" fill="#1F2933">Y lo que se le puede añadir</text>
<text x="190" y="404" font-size="26" text-anchor="middle" font-weight="bold" fill="#1F2933">F/EA5JMS</text>
<text x="190" y="436" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">de visita en Francia</text>
<text x="460" y="404" font-size="26" text-anchor="middle" font-weight="bold" fill="#1F2933">EA5JMS/P</text>
<text x="460" y="436" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">en portable (opcional)</text>
<text x="320" y="476" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673" font-style="italic">La barra separa siempre el añadido del distintivo</text></svg>
