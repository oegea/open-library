<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img"><title>El ancho de banda de cada modo, a escala</title><rect x="1" y="1" width="638" height="418" rx="18" fill="#FAF6EC" stroke="#E7DFCC" stroke-width="2"/><text x="320" y="42" font-size="22" text-anchor="middle" font-weight="bold" fill="#1F2933">Cuánto dial ocupa cada modo (a escala)</text>
<text x="96" y="111" font-size="22" text-anchor="end" font-weight="bold" fill="#1F2933">FT8</text>
<rect x="112" y="84" width="2" height="38" rx="0" fill="#059669" stroke="none" stroke-width="2"/>
<text x="126" y="111" font-size="20" text-anchor="start" font-weight="bold" fill="#1F2933">50 Hz</text>
<text x="96" y="171" font-size="22" text-anchor="end" font-weight="bold" fill="#1F2933">CW</text>
<rect x="112" y="144" width="3.5625" height="38" rx="0" fill="#059669" stroke="none" stroke-width="2"/>
<text x="127.5625" y="171" font-size="20" text-anchor="start" font-weight="bold" fill="#1F2933">150 Hz</text>
<text x="96" y="231" font-size="22" text-anchor="end" font-weight="bold" fill="#1F2933">SSB</text>
<rect x="112" y="204" width="64.125" height="38" rx="6" fill="#2563EB" stroke="none" stroke-width="2"/>
<text x="188.125" y="231" font-size="20" text-anchor="start" font-weight="normal" fill="#1F2933">2,7 kHz</text>
<text x="96" y="291" font-size="22" text-anchor="end" font-weight="bold" fill="#1F2933">AM</text>
<rect x="112" y="264" width="142.5" height="38" rx="6" fill="#D97706" stroke="none" stroke-width="2"/>
<text x="266.5" y="291" font-size="20" text-anchor="start" font-weight="normal" fill="#1F2933">6 kHz</text>
<text x="96" y="351" font-size="22" text-anchor="end" font-weight="bold" fill="#1F2933">FM</text>
<rect x="112" y="324" width="380.0" height="38" rx="6" fill="#DC2626" stroke="none" stroke-width="2"/>
<text x="504.0" y="351" font-size="20" text-anchor="start" font-weight="normal" fill="#1F2933">16 kHz</text>
<text x="320" y="400" font-size="19" text-anchor="middle" font-weight="normal" fill="#5B6673">El morse y el FT8 son alfileres: apenas se ven</text></svg>
