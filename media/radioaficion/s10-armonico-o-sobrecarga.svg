<text x="481" y="200" font-size="18" text-anchor="middle" font-weight="bold" fill="#DC2626">armónico</text>
<text x="320" y="316" font-size="19" text-anchor="middle" font-weight="bold" fill="#1F2933">Fallo en el transmisor: filtro paso bajo</text>
