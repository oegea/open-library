<text x="120" y="462.24" font-size="26" text-anchor="middle" font-weight="bold" fill="#DC2626">U</text>
<text x="101.2512" y="495.36" font-size="26" text-anchor="middle" font-weight="bold" fill="#2563EB">I</text>
<circle cx="138.7488" cy="486.78000000000003" r="16.12" fill="#D97706" stroke="#D97706" stroke-width="3"/>
<text x="138.7488" y="495.36" font-size="26" text-anchor="middle" font-weight="bold" fill="#FFFFFF">?</text>
<text x="200" y="464" font-size="28" text-anchor="start" font-weight="bold" fill="#1F2933">R = U / I</text>
<text x="200" y="494" font-size="19" text-anchor="start" font-weight="normal" fill="#5B6673">U encima de I: se dividen</text>
