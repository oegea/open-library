<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img"><title>El triángulo de la ley de Ohm</title><rect x="1" y="1" width="638" height="638" rx="18" fill="#FAF6EC" stroke="#E7DFCC" stroke-width="2"/><text x="320" y="44" font-size="22" text-anchor="middle" font-weight="bold" fill="#1F2933">El triángulo de Ohm</text>
<path d="M320 66 L437.8 256 L202.2 256 Z" stroke="#1F2933" stroke-width="3" fill="#FFFFFF" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="261.1" y1="161.0" x2="378.9" y2="161.0" stroke="#1F2933" stroke-width="3" stroke-linecap="round"/>
<line x1="320" y1="161.0" x2="320" y2="256" stroke="#1F2933" stroke-width="3" stroke-linecap="round"/>
