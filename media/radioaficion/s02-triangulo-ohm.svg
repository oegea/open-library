<text x="270.524" y="233.2" font-size="44" text-anchor="middle" font-weight="bold" fill="#2563EB">I</text>
<text x="369.476" y="233.2" font-size="44" text-anchor="middle" font-weight="bold" fill="#1F2933">R</text>
<text x="320" y="290" font-size="20" text-anchor="middle" font-weight="normal" fill="#5B6673">Tapa la letra que buscas y lee lo que queda</text>
<rect x="50" y="318" width="540" height="92" rx="14" fill="#EFE7D6" stroke="none" stroke-width="2"/>
<path d="M120 328 L164.64 400 L75.36 400 Z" stroke="#1F2933" stroke-width="3" fill="#FFFFFF" stroke-linecap="round" stroke-linejoin="round"/>
