<text x="120" y="358.24" font-size="26" text-anchor="middle" font-weight="bold" fill="#DC2626">U</text>
<circle cx="101.2512" cy="382.78000000000003" r="16.12" fill="#D97706" stroke="#D97706" stroke-width="3"/>
<text x="101.2512" y="391.36" font-size="26" text-anchor="middle" font-weight="bold" fill="#FFFFFF">?</text>
<text x="138.7488" y="391.36" font-size="26" text-anchor="middle" font-weight="bold" fill="#1F2933">R</text>
<text x="200" y="360" font-size="28" text-anchor="start" font-weight="bold" fill="#1F2933">I = U / R</text>
<text x="200" y="390" font-size="19" text-anchor="start" font-weight="normal" fill="#5B6673">U encima de R: se dividen</text>
