<text x="138.7488" y="599.36" font-size="26" text-anchor="middle" font-weight="bold" fill="#1F2933">R</text>
<text x="200" y="568" font-size="28" text-anchor="start" font-weight="bold" fill="#1F2933">U = I × R</text>
<text x="200" y="598" font-size="19" text-anchor="start" font-weight="normal" fill="#5B6673">I al lado de R: se multiplican</text></svg>
