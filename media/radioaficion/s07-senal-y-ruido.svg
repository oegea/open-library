<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img"><title>Amplificar sube por igual la señal y el ruido</title><rect x="1" y="1" width="638" height="418" rx="18" fill="#FAF6EC" stroke="#E7DFCC" stroke-width="2"/><text x="320" y="42" font-size="22" text-anchor="middle" font-weight="bold" fill="#1F2933">Amplificar no separa la señal del ruido</text>
<text x="170" y="84" font-size="20" text-anchor="middle" font-weight="bold" fill="#5B6673">Antes de amplificar</text>
<path d="M40 330 L40 317 L46 314 L52 316 L58 313 L64 313 L70 319 L76 320 L82 310 L88 317 L94 317 L100 308 L106 314 L112 310 L118 314 L124 312 L130 318 L136 312 L142 310 L148 314 L154 311 L160 312 L166 268 L172 268 L178 268 L184 319 L190 311 L196 313 L202 316 L208 320 L214 310 L220 314 L226 311 L232 309 L238 311 L244 309 L250 315 L256 310 L262 315 L268 309 L274 309 L280 319 L286 318 L292 317 L298 308 L300 330 Z" stroke="#5B6673" stroke-width="2" fill="#D6D3CB" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="172" y1="308" x2="172" y2="268" stroke="#2563EB" stroke-width="8" stroke-linecap="butt"/>
<line x1="40" y1="330" x2="300" y2="330" stroke="#1F2933" stroke-width="3" stroke-linecap="round"/>
<text x="188" y="282" font-size="19" text-anchor="start" font-weight="bold" fill="#2563EB">señal</text>
<text x="80" y="300" font-size="19" text-anchor="middle" font-weight="bold" fill="#5B6673">ruido</text>
<text x="470" y="84" font-size="20" text-anchor="middle" font-weight="bold" fill="#5B6673">Después de amplificar</text>
<path d="M340 330 L340 284 L346 278 L352 289 L358 282 L364 286 L370 288 L376 279 L382 279 L388 267 L394 276 L400 267 L406 269 L412 264 L418 276 L424 294 L430 269 L436 265 L442 267 L448 280 L454 274 L460 293 L466 144 L472 144 L478 144 L484 270 L490 279 L496 290 L502 298 L508 269 L514 264 L520 297 L526 271 L532 285 L538 295 L544 290 L550 272 L556 269 L562 299 L568 278 L574 299 L580 274 L586 288 L592 268 L598 265 L600 330 Z" stroke="#5B6673" stroke-width="2" fill="#D6D3CB" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="472" y1="264" x2="472" y2="144" stroke="#2563EB" stroke-width="8" stroke-linecap="butt"/>
<line x1="340" y1="330" x2="600" y2="330" stroke="#1F2933" stroke-width="3" stroke-linecap="round"/>
<text x="488" y="158" font-size="19" text-anchor="start" font-weight="bold" fill="#2563EB">señal</text>
<text x="380" y="256" font-size="19" text-anchor="middle" font-weight="bold" fill="#5B6673">ruido</text>
<text x="320" y="384" font-size="20" text-anchor="middle" font-weight="normal" fill="#1F2933">Las dos crecen igual: la señal sobresale lo mismo</text></svg>
