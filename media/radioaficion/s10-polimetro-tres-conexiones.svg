<line x1="455.6" y1="424.4" x2="484.4" y2="395.6" stroke="#1F2933" stroke-width="3" stroke-linecap="round"/>
<circle cx="290" cy="360" r="26" fill="#FFFFFF" stroke="#D97706" stroke-width="4"/>
