<text x="320" y="262" font-size="19" text-anchor="middle" font-weight="normal" fill="#5B6673">toca dos puntos, sin cortar nada</text>
<rect x="24" y="290" width="592" height="216" rx="14" fill="#EFE7D6" stroke="none" stroke-width="2"/>
<text x="320" y="322" font-size="21" text-anchor="middle" font-weight="bold" fill="#D97706">Amperímetro: en serie</text>
