<text x="320" y="492" font-size="19" text-anchor="middle" font-weight="normal" fill="#5B6673">se abre el circuito y se intercala</text>
<rect x="24" y="520" width="592" height="216" rx="14" fill="#EFE7D6" stroke="none" stroke-width="2"/>
<text x="320" y="552" font-size="21" text-anchor="middle" font-weight="bold" fill="#2563EB">Ohmímetro: sin tensión</text>
