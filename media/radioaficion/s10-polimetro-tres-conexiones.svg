<circle cx="330" cy="180" r="24" fill="#FDE68A" stroke="#1F2933" stroke-width="3"/>
<line x1="315.6" y1="165.6" x2="344.4" y2="194.4" stroke="#1F2933" stroke-width="3" stroke-linecap="round"/>
