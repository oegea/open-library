<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img"><title>Las tres conexiones del polímetro</title><rect x="1" y="1" width="638" height="758" rx="18" fill="#FAF6EC" stroke="#E7DFCC" stroke-width="2"/><text x="320" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#1F2933">El polímetro, de tres maneras</text>
