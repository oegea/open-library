<rect x="100" y="368" width="20" height="10" rx="3" fill="#1F2933" stroke="none" stroke-width="2"/>
<text x="110" y="404" font-size="26" text-anchor="middle" font-weight="bold" fill="#DC2626">+</text>
<text x="110" y="436" font-size="26" text-anchor="middle" font-weight="bold" fill="#2563EB">−</text>
<circle cx="470" cy="410" r="24" fill="#FDE68A" stroke="#1F2933" stroke-width="3"/>
