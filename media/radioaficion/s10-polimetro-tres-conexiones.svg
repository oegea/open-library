<text x="410" y="649" font-size="26" text-anchor="middle" font-weight="bold" fill="#2563EB">Ω</text>
<text x="210" y="686" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">pieza</text>
<text x="320" y="722" font-size="19" text-anchor="middle" font-weight="normal" fill="#5B6673">la pieza suelta, sin pila ni enchufe</text></svg>
