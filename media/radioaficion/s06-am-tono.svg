<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img"><title>Portadora de 7.000 kHz modulada con un tono de 1 kHz: tres señales</title><defs><marker id="arr-1F2933" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F2933"/></marker><marker id="arr-5B6673" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6673"/></marker></defs><rect x="1" y="1" width="638" height="398" rx="18" fill="#FAF6EC" stroke="#E7DFCC" stroke-width="2"/><text x="320" y="42" font-size="22" text-anchor="middle" font-weight="bold" fill="#1F2933">Un tono de 1 kHz sobre 7.000 kHz: tres señales</text>
