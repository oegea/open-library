<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img"><title>Las capas de la ionosfera, de día y de noche</title><rect x="1" y="1" width="638" height="518" rx="18" fill="#FAF6EC" stroke="#E7DFCC" stroke-width="2"/><text x="320" y="38" font-size="22" text-anchor="middle" font-weight="bold" fill="#1F2933">Las capas, de día y de noche</text>
<rect x="30" y="56" width="280" height="410" rx="14" fill="#E0F2FE" stroke="none" stroke-width="2"/>
<text x="170" y="86" font-size="21" text-anchor="middle" font-weight="bold" fill="#1F2933">De día</text>
<circle cx="270" cy="80" r="14" fill="#FBBF24" stroke="#F59E0B" stroke-width="3"/>
<rect x="46" y="104" width="248" height="80" rx="10" fill="#C4B5FD" stroke="#7C3AED" stroke-width="2"/>
<text x="62" y="152.0" font-size="24" text-anchor="start" font-weight="bold" fill="#1F2933">F2</text>
<text x="282" y="151.0" font-size="18" text-anchor="end" font-weight="normal" fill="#1F2933">200–400 km</text>
<rect x="46" y="194" width="248" height="60" rx="10" fill="#D8CCFE" stroke="#7C3AED" stroke-width="2"/>
<text x="62" y="232.0" font-size="24" text-anchor="start" font-weight="bold" fill="#1F2933">F1</text>
<text x="282" y="231.0" font-size="18" text-anchor="end" font-weight="normal" fill="#1F2933">130–200 km</text>
<rect x="46" y="264" width="248" height="54" rx="10" fill="#E4DCFE" stroke="#7C3AED" stroke-width="2"/>
<text x="62" y="299.0" font-size="24" text-anchor="start" font-weight="bold" fill="#1F2933">E</text>
<text x="282" y="298.0" font-size="18" text-anchor="end" font-weight="normal" fill="#1F2933">90–130 km</text>
<rect x="46" y="328" width="248" height="54" rx="10" fill="#FECACA" stroke="#DC2626" stroke-width="2"/>
<text x="62" y="363.0" font-size="24" text-anchor="start" font-weight="bold" fill="#1F2933">D</text>
<text x="282" y="362.0" font-size="18" text-anchor="end" font-weight="normal" fill="#1F2933">60–90 km: absorbe</text>
<rect x="46" y="404" width="248" height="46" rx="10" fill="#D9C7A3" stroke="#8A6D3B" stroke-width="2"/>
<text x="170" y="434" font-size="18" text-anchor="middle" font-weight="normal" fill="#1F2933">suelo</text>
<rect x="330" y="56" width="280" height="410" rx="14" fill="#1E293B" stroke="none" stroke-width="2"/>
<text x="470" y="86" font-size="21" text-anchor="middle" font-weight="bold" fill="#FFFFFF">De noche</text>
<circle cx="570" cy="80" r="14" fill="#F8FAFC" stroke="#F8FAFC" stroke-width="3"/>
<circle cx="577" cy="75" r="12" fill="#1E293B" stroke="#1E293B" stroke-width="3"/>
<rect x="346" y="104" width="248" height="150" rx="10" fill="#C4B5FD" stroke="#7C3AED" stroke-width="2"/>
<text x="362" y="187.0" font-size="24" text-anchor="start" font-weight="bold" fill="#1F2933">F</text>
<text x="582" y="186.0" font-size="18" text-anchor="end" font-weight="normal" fill="#1F2933">130–400 km</text>
<rect x="346" y="268" width="248" height="50" rx="10" fill="#DDD6FE" fill-opacity="0.35" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 6"/>
<text x="362" y="301.0" font-size="24" text-anchor="start" font-weight="bold" fill="#E2E8F0">E</text>
<text x="582" y="300.0" font-size="18" text-anchor="end" font-weight="normal" fill="#E2E8F0">muy débil</text>
<rect x="346" y="332" width="248" height="50" rx="10" fill="none" fill-opacity="0.35" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 6"/>
<text x="362" y="365.0" font-size="24" text-anchor="start" font-weight="bold" fill="#E2E8F0">D</text>
<text x="582" y="364.0" font-size="18" text-anchor="end" font-weight="normal" fill="#E2E8F0">ha desaparecido</text>
<rect x="346" y="404" width="248" height="46" rx="10" fill="#D9C7A3" stroke="#8A6D3B" stroke-width="2"/>
<text x="470" y="434" font-size="18" text-anchor="middle" font-weight="normal" fill="#1F2933">suelo</text>
<text x="320" y="498" font-size="19" text-anchor="middle" font-weight="normal" fill="#5B6673">De noche solo queda la capa F: el espejo sin el secante</text></svg>
