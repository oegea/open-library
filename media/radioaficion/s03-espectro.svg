<text x="500" y="530" font-size="19" text-anchor="middle" font-weight="normal" fill="#5B6673">1 cm a 1 mm</text>
<line x1="48" y1="100" x2="48" y2="548" stroke="#2563EB" stroke-width="5" stroke-linecap="round" marker-end="url(#arr-2563EB)"/>
<text x="34" y="324" font-size="19" text-anchor="middle" font-weight="bold" fill="#2563EB" transform="rotate(-90 34 324)">más frecuencia</text>
<text x="320" y="592" font-size="19" text-anchor="middle" font-weight="normal" fill="#5B6673">Cada tramo: diez veces más frecuencia que el anterior</text></svg>
