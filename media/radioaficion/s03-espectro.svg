<text x="500" y="78" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">longitud de onda</text>
<rect x="84" y="92" width="500" height="48" rx="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
<text x="130" y="125" font-size="24" text-anchor="middle" font-weight="bold" fill="#1F2933">VLF</text>
<text x="300" y="124" font-size="20" text-anchor="middle" font-weight="normal" fill="#1F2933">3 a 30 kHz</text>
<text x="500" y="124" font-size="19" text-anchor="middle" font-weight="normal" fill="#5B6673">100 a 10 km</text>
<rect x="84" y="150" width="500" height="48" rx="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
<text x="130" y="183" font-size="24" text-anchor="middle" font-weight="bold" fill="#1F2933">LF</text>
<text x="300" y="182" font-size="20" text-anchor="middle" font-weight="normal" fill="#1F2933">30 a 300 kHz</text>
<text x="500" y="182" font-size="19" text-anchor="middle" font-weight="normal" fill="#5B6673">10 a 1 km</text>
<rect x="84" y="208" width="500" height="48" rx="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
<text x="130" y="241" font-size="24" text-anchor="middle" font-weight="bold" fill="#1F2933">MF</text>
<text x="300" y="240" font-size="20" text-anchor="middle" font-weight="normal" fill="#1F2933">300 kHz a 3 MHz</text>
<text x="500" y="240" font-size="19" text-anchor="middle" font-weight="normal" fill="#5B6673">1.000 a 100 m</text>
<rect x="84" y="266" width="500" height="48" rx="10" fill="#FDE68A" stroke="#1F2933" stroke-width="2"/>
<text x="130" y="299" font-size="24" text-anchor="middle" font-weight="bold" fill="#9A3412">HF</text>
<text x="300" y="298" font-size="20" text-anchor="middle" font-weight="bold" fill="#1F2933">3 a 30 MHz</text>
<text x="500" y="298" font-size="19" text-anchor="middle" font-weight="normal" fill="#5B6673">100 a 10 m</text>
<rect x="84" y="324" width="500" height="48" rx="10" fill="#FDE68A" stroke="#1F2933" stroke-width="2"/>
<text x="130" y="357" font-size="24" text-anchor="middle" font-weight="bold" fill="#9A3412">VHF</text>
<text x="300" y="356" font-size="20" text-anchor="middle" font-weight="bold" fill="#1F2933">30 a 300 MHz</text>
<text x="500" y="356" font-size="19" text-anchor="middle" font-weight="normal" fill="#5B6673">10 a 1 m</text>
<rect x="84" y="382" width="500" height="48" rx="10" fill="#FDE68A" stroke="#1F2933" stroke-width="2"/>
<text x="130" y="415" font-size="24" text-anchor="middle" font-weight="bold" fill="#9A3412">UHF</text>
<text x="300" y="414" font-size="20" text-anchor="middle" font-weight="bold" fill="#1F2933">300 MHz a 3 GHz</text>
<text x="500" y="414" font-size="19" text-anchor="middle" font-weight="normal" fill="#5B6673">1 m a 10 cm</text>
