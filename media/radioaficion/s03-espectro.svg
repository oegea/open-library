<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img"><title>Los tramos del espectro radioeléctrico</title><defs><marker id="arr-2563EB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker></defs><rect x="1" y="1" width="638" height="618" rx="18" fill="#FAF6EC" stroke="#E7DFCC" stroke-width="2"/><text x="320" y="42" font-size="22" text-anchor="middle" font-weight="bold" fill="#1F2933">El espectro, tramo a tramo</text>
<text x="130" y="78" font-size="18" text-anchor="middle" font-weight="normal" fill="#5B6673">tramo</text>
