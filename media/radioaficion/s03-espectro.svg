<text x="500" y="472" font-size="19" text-anchor="middle" font-weight="normal" fill="#5B6673">10 a 1 cm</text>
<rect x="84" y="498" width="500" height="48" rx="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
